name: Deploy Organic Orbit Digital

on:
  push:
    branches:
      - main
    paths:
      - "out/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy static website to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to cPanel via SSH
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USERNAME }}
          SSH_PORT: ${{ secrets.CPANEL_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Add cPanel host key to known_hosts
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          
          echo "Testing SSH connection to cPanel at $SSH_HOST:$SSH_PORT as $SSH_USER..."
          ssh -p "$SSH_PORT" -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" "echo 'SSH handshake verified!'" || {
            echo "Direct echo command skipped or restricted by shell; proceeding with file transfer..."
          }
          
          echo "Deploying website files to /home/onlinepr/organicorbitdigital.com/..."
          
          # Method 1: Stream compressed archive over SSH (fastest & native to cPanel Jailshell)
          if tar -czf - -C out . | ssh -p "$SSH_PORT" -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ServerAliveInterval=15 "$SSH_USER@$SSH_HOST" "tar -xzf - -C /home/onlinepr/organicorbitdigital.com/" ; then
            echo "Successfully deployed website to cPanel via SSH archive stream!"
          # Method 2: Legacy OpenSSH SCP with -O flag (bypasses SFTP subsystem requirement)
          elif scp -O -P "$SSH_PORT" -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -r out/. "$SSH_USER@$SSH_HOST:/home/onlinepr/organicorbitdigital.com/" ; then
            echo "Successfully deployed website to cPanel via legacy SCP (-O)!"
          else
            echo "Deployment failed. Please check server SSH logs."
            exit 1
          fi
